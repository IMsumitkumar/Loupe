[package]
name = "sysmon-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "sysmon_core"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "verify"
path = "src/bin/verify.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
toml = "1"
